name: Normalize project spelling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-project-spelling.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize spelling across repository
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          old = 'ori' + 'edraw'
          new = 'ori' + 'redraw'
          pattern = re.compile(re.escape(old), re.IGNORECASE)

          def replacement(match: re.Match[str]) -> str:
              text = match.group(0)
              if text.isupper():
                  return new.upper()
              if text[:1].isupper() and text[1:].islower():
                  return new.capitalize()
              if text.islower():
                  return new
              return new

          changed_files = 0
          replacements = 0
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              data = path.read_bytes()
              if b'\x00' in data:
                  continue
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              updated, count = pattern.subn(replacement, text)
              if count:
                  path.write_text(updated, encoding='utf-8', newline='')
                  changed_files += 1
                  replacements += count

          for path in sorted(
              [p for p in root.rglob('*') if '.git' not in p.parts],
              key=lambda p: len(p.parts),
              reverse=True,
          ):
              if not pattern.search(path.name):
                  continue
              target = path.with_name(pattern.sub(replacement, path.name))
              path.rename(target)

          print(f'normalized {replacements} occurrence(s) in {changed_files} file(s)')
          PY

      - name: Commit normalized tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No spelling changes required.'
            exit 0
          fi
          git commit -m 'Normalize Oriredraw project spelling'
          git push
