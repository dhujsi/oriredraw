name: Deploy Oriedraw to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize project spelling once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          old = 'ori' + 'edraw'
          new = 'ori' + 'redraw'
          pattern = re.compile(re.escape(old), re.IGNORECASE)

          def replacement(match):
              text = match.group(0)
              if text.isupper():
                  return new.upper()
              if text[:1].isupper() and text[1:].islower():
                  return new.capitalize()
              return new

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              data = path.read_bytes()
              if b'\x00' in data:
                  continue
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              updated = pattern.sub(replacement, text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='')

          for path in sorted(
              [p for p in root.rglob('*') if '.git' not in p.parts],
              key=lambda p: len(p.parts),
              reverse=True,
          ):
              if pattern.search(path.name):
                  path.rename(path.with_name(pattern.sub(replacement, path.name)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize Oriredraw project spelling'
            git push
          fi

      - name: Assemble static site
        run: |
          mkdir -p _site/python
          cp -R web/. _site/
          cp foldability.py reconstructor.py web_bridge.py _site/python/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
