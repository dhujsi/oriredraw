name: Deploy Oriredraw to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble static site
        run: |
          mkdir -p _site/python
          cp -R web/. _site/
          cp foldability.py reconstructor.py web_bridge.py construction_search.py shadow_search.py shadow_bridge.py _site/python/
          cp VERSION _site/VERSION
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          sed -E -i "s/^const WEB_ENGINE_VERSION = '.*';$/const WEB_ENGINE_VERSION = '${VERSION_VALUE}';/" _site/app.js _site/pyodide-worker.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
